base_config: configs/base_configs/cifar10-base_config.yaml

data: sc_cifar10 # {cifar10, cifar100, imagenet}

attack: AA-linf # pipeline+{pgdeot, AA} to attack the whole pipeline sc_bpda
clf: AT

subset_size: 512 # number of test images
num_iterations: 2000

seed: 2007

init_reso: 8
end_reso: 64

iterations_for_upsampling:
  - 256
  - 512
  - 1024

max_rank: 8 
ranks_for_upsampling:
  - 16
  - 10
  - 4

wavelet_recon_min_targets: 0
